apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vio-vision-tls-cert
  namespace: istio-system
spec:
  secretName: vio-vision-tls-cert
  dnsNames:
  - vio-demo-qa.vio.live
  duration: 2160h
  renewBefore: 360h
  isCA: false
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  usages:
  - server auth
  - client auth
  issuerRef:
    name: clusterissuer-api-dev-vio-live-cluster
    kind: ClusterIssuer
    group: cert-manager.io
