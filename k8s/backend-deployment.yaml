apiVersion: apps/v1
kind: Deployment
metadata:
  name: vio-vision-backend
  namespace: vio-demo
  labels:
    app: vio-vision-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vio-vision-backend
  template:
    metadata:
      labels:
        app: vio-vision-backend
        version: v0.4.0
    spec:
      imagePullSecrets:
      - name: reachuqa2
      containers:
      - name: backend
        image: reachuqa2.azurecr.io/vio-vision-backend:v0.4.0
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: PORT
          value: "8000"
        - name: AI_MODE
          value: "cloud"
        # Azure OpenAI
        - name: AZURE_OPENAI_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: vio-openai-secret
              key: AZURE_OPENAI_ENDPOINT
        - name: AZURE_OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: vio-openai-secret
              key: AZURE_OPENAI_API_KEY
        - name: AZURE_OPENAI_DEPLOYMENT
          value: "gpt-4o"
        - name: AZURE_OPENAI_API_VERSION
          value: "2024-12-01-preview"
        # Azure Video Indexer (optional — gracefully disabled if absent)
        - name: AZURE_VIDEO_INDEXER_ACCOUNT_ID
          valueFrom:
            secretKeyRef:
              name: vio-video-indexer
              key: AZURE_VIDEO_INDEXER_ACCOUNT_ID
              optional: true
        - name: AZURE_VIDEO_INDEXER_API_KEY
          valueFrom:
            secretKeyRef:
              name: vio-video-indexer
              key: AZURE_VIDEO_INDEXER_API_KEY
              optional: true
        - name: AZURE_VIDEO_INDEXER_LOCATION
          valueFrom:
            secretKeyRef:
              name: vio-video-indexer
              key: AZURE_VIDEO_INDEXER_LOCATION
              optional: true
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "3Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
