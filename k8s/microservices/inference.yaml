---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vio-inference
  namespace: vio-demo
  labels:
    app: vio-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vio-inference
  template:
    metadata:
      labels:
        app: vio-inference
    spec:
      imagePullSecrets:
      - name: reachuqa2
      # Schedule onto GPU node pool if available
      tolerations:
      - key: "sku"
        operator: "Equal"
        value: "gpu"
        effect: "NoSchedule"
      nodeSelector:
        # Remove this if you don't have a gpu node pool yet (runs on CPU fallback)
        # agentpool: gpu
        kubernetes.io/os: linux
      containers:
      - name: inference
        image: reachuqa2.azurecr.io/vio-inference:v0.5.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8002
          name: http
        env:
        - name: REDIS_URL
          value: "redis://vio-redis:6379/0"
        - name: AI_INTERVAL_SEC
          value: "3.0"
        - name: YOLO_MODEL
          value: "yolov8m.pt"
        - name: AZURE_OPENAI_ENDPOINT
          valueFrom:
            secretKeyRef: {name: vio-openai-secret, key: AZURE_OPENAI_ENDPOINT, optional: true}
        - name: AZURE_OPENAI_API_KEY
          valueFrom:
            secretKeyRef: {name: vio-openai-secret, key: AZURE_OPENAI_API_KEY, optional: true}
        - name: AZURE_OPENAI_DEPLOYMENT
          value: "gpt-4o"
        - name: AZURE_OPENAI_API_VERSION
          value: "2024-12-01-preview"
        - name: AZURE_AI_VISION_ENDPOINT
          valueFrom:
            secretKeyRef: {name: vio-ai-vision, key: endpoint, optional: true}
        - name: AZURE_AI_VISION_KEY
          valueFrom:
            secretKeyRef: {name: vio-ai-vision, key: key, optional: true}
        resources:
          requests: {memory: "2Gi", cpu: "1000m"}
          limits:
            memory: "6Gi"
            cpu: "4000m"
            # Uncomment when GPU pool is ready:
            # nvidia.com/gpu: 1
        livenessProbe:
          httpGet: {path: /health, port: 8002}
          initialDelaySeconds: 60
          periodSeconds: 15
        readinessProbe:
          httpGet: {path: /health, port: 8002}
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vio-inference
  namespace: vio-demo
spec:
  selector:
    app: vio-inference
  ports:
  - port: 8002
    targetPort: 8002
    name: http
