---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vio-gateway
  namespace: vio-demo
  labels:
    app: vio-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vio-gateway
  template:
    metadata:
      labels:
        app: vio-gateway
    spec:
      imagePullSecrets:
      - name: reachuqa2
      containers:
      - name: gateway
        image: reachuqa2.azurecr.io/vio-gateway:v0.5.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 50051
          name: grpc
        env:
        - name: REDIS_URL
          value: "redis://vio-redis:6379/0"
        - name: INGESTION_URL
          value: "http://vio-ingestion:8001"
        - name: POSTGRES_URL
          valueFrom:
            secretKeyRef:
              name: vio-postgres
              key: dsn
        - name: GRPC_PORT
          value: "50051"
        - name: VIO_API_KEYS
          valueFrom:
            secretKeyRef: {name: vio-api-keys, key: keys, optional: true}
        resources:
          requests: {memory: "512Mi", cpu: "250m"}
          limits: {memory: "2Gi", cpu: "1000m"}
        livenessProbe:
          httpGet: {path: /, port: 8000}
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet: {path: /, port: 8000}
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: vio-gateway
  namespace: vio-demo
spec:
  selector:
    app: vio-gateway
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  - port: 50051
    targetPort: 50051
    name: grpc
