---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vio-ingestion
  namespace: vio-demo
  labels:
    app: vio-ingestion
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vio-ingestion
  template:
    metadata:
      labels:
        app: vio-ingestion
    spec:
      imagePullSecrets:
      - name: reachuqa2
      containers:
      - name: ingestion
        image: reachuqa2.azurecr.io/vio-ingestion:v0.5.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
          name: http
        env:
        - name: REDIS_URL
          value: "redis://vio-redis:6379/0"
        - name: FRAME_TTL_SEC
          value: "10"
        - name: JPEG_QUALITY
          value: "80"
        resources:
          requests: {memory: "512Mi", cpu: "500m"}
          limits: {memory: "2Gi", cpu: "2000m"}
        livenessProbe:
          httpGet: {path: /health, port: 8001}
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet: {path: /health, port: 8001}
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: vio-ingestion
  namespace: vio-demo
spec:
  selector:
    app: vio-ingestion
  ports:
  - port: 8001
    targetPort: 8001
    name: http
