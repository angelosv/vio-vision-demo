apiVersion: apps/v1
kind: Deployment
metadata:
  name: vio-vision-web
  namespace: vio-demo
  labels:
    app: vio-vision-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vio-vision-web
  template:
    metadata:
      labels:
        app: vio-vision-web
        version: demo
    spec:
      imagePullSecrets:
      - name: reachuqa2
      containers:
      - name: web
        image: reachuqa2.azurecr.io/vio-vision-web:demo-v2
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://vio-vision-backend:8000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
